<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org">
<head> 
    <title>Getting Started: Handling Form Submission</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
	<h1>formulario</h1>
    <form action="#" th:action="@{/formularioIMC}" th:object="${formularioIMC}" method="post">
    	<p>nombre: <input type="text" th:field="*{nombre} "required /></p>
        <p>edad <input type="number" th:field="*{edad}"required /></p>
		<p>genero: <input type="text" th:field="*{genero}"required /></p>
		<p>IMC: <input type="number" th:field="*{IMC}"required /></p>

		 <p><input type="submit" value="Submit" /> <input type="reset" value="Reset" /></p>
    </form>
</body>
</html>
