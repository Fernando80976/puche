<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
    <body>
        <form action="#" th:action="@{/}" th:object="${formularioPersona}" method="post">
            <table>
                <tr>
                    <td>Nombre:</td>
                    <td><input type="text" th:field="*{Nombre}" /></td>
                    <td th:if="${#fields.hasErrors('Nombre')}" th:errors="*{Nombre}">Error nombre</td>
                </tr>
                <tr>
                    <td>edad:</td>
                    <td><input type="text" th:field="*{Edad}" /></td>
                    <td th:if="${#fields.hasErrors('Edad')}" th:errors="*{Edad}">edad Error</td>
                </tr>
                <tr>
                    <td><button type="submit">enviar</button></td>
                </tr>
            </table>
        </form>
    </body>
</html>
